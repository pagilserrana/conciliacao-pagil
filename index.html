<style>

  --paper:#F3F5F2; --surface:#FFFFFF; --ink:#17201B; --ink-2:#56625B; --line:#D6DDD7;
  --green:#2E6A45; --green-soft:#E1EBE3; --amber:#9C6210; --amber-soft:#F6EAD3;

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

:root[data-theme="dark"]{

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px 8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-stretch:75%;font-weight:760;font-size:19px;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:14px;height:22px;background:var(--green);clip-path:polygon(0 100%,55% 0,100% 0,45% 100%)}
.brand small{font-weight:450;font-stretch:100%;color:var(--ink-2);font-size:13px}
.period{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.period input{border:1px solid var(--line);background:var(--surface);height:34px;border-radius:8px;padding:0 8px}
.quick{display:flex;gap:4px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.quick button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:650}
:root[data-theme="dark"] .btn.primary{color:#0f1a13}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0f1a13}}
.btn.sm{padding:3px 10px;font-size:13px;border-radius:6px}

nav.tabs{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:9px 14px 10px;cursor:pointer;color:var(--ink-2);border-bottom:3px solid transparent;font-weight:560;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}

h1.page{font-stretch:70%;font-weight:800;font-size:clamp(32px,5vw,50px);line-height:1;margin:26px 0 6px}

.mini.g{border-left-color:var(--green)} .mini.g b{color:var(--green)} .mini.a{border-left-color:var(--amber)} .mini.a b{color:var(--amber)} .mini.r{border-left-color:var(--red)} .mini.r b{color:var(--red)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.board .col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;min-height:260px}
.colh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.lista{overflow:auto;max-height:480px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);justify-self:center}
.dot.ok{background:var(--green)} .dot.conf{background:var(--amber)} .dot.ni{background:var(--red)} .dot.out{background:var(--blue)}
.cand.ent.sel{border-color:var(--blue);background:var(--blue-soft)}
.linkbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
.linkbar .sp{flex:1}
@media (max-width:900px){ .steps,.minis{grid-template-columns:1fr 1fr} .board{grid-template-columns:1fr} }
.fsel{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 6px;font-size:13px;max-width:150px}
.fwrap{display:block;margin-top:4px}
.sync{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.sync.ok{color:var(--green)} .sync.pend{color:var(--ink-2)} .sync.err{color:var(--red);border-color:var(--red);background:var(--red-soft);font-weight:650}
@keyframes flash{0%{background:var(--amber-soft)}100%{background:transparent}}
tr.flash td,.cand.flash{animation:flash 1.8s ease-out}
body.conectando header .period,body.conectando #quick,body.conectando nav.tabs,body.conectando #sync,body.conectando header .btn{display:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;max-width:min(600px,92vw);z-index:60;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}

@media (max-width:900px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr))} .imp,.two{grid-template-columns:1fr} .facts{grid-template-columns:1fr 1fr} .bar{grid-template-columns:110px minmax(0,1fr) 110px} }
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

<script>
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const money=c=>BRL.format((c||0)/100);
const br=d=>d?d.split('-').reverse().join('/'):'';
const brs=d=>d?d.slice(8,10)+'/'+d.slice(5,7):'';
function addDays(d,n){const t=new Date(d+'T12:00:00');t.setDate(t.getDate()+n);return t.toISOString().slice(0,10);}
function dayDiff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);}
function today(){const t=new Date();t.setMinutes(t.getMinutes()-t.getTimezoneOffset());return t.toISOString().slice(0,10);}
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
const sum=(a,f=x=>x.valor)=>a.reduce((s,x)=>s+(f(x)||0),0);
function toast(m,ms=4500){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms);}

/* ============ leitura de valores e datas ============ */
function parseValor(v){
  if(v==null||v==='') return null;
  if(typeof v==='number') return {c:Math.round(v*100),dc:null};
  let s=String(v).trim(); let dc=null;
  const m=/([CD])\s*\*?$/i.exec(s); if(m&&/\d/.test(s)){ dc=m[1].toUpperCase(); s=s.slice(0,m.index); }
  let neg=/^-|\(.*\)|-\s*$/.test(s.replace(/R\$/,'').trim());
  s=s.replace(/[^\d,.-]/g,'').replace(/-/g,''); if(!s) return null;
  if(s.includes(',')&&s.includes('.')){ if(s.lastIndexOf(',')>s.lastIndexOf('.')) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); }
  else if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if((s.match(/\./g)||[]).length>1) s=s.replace(/\./g,'');
  const n=parseFloat(s); if(isNaN(n)) return null;
  return {c:Math.round(n*100)*(neg?-1:1),dc};
}
function parseData(v){
  if(v==null||v==='') return null;
  if(v instanceof Date&&!isNaN(v)){ const t=new Date(v.getTime()-v.getTimezoneOffset()*6e4); return t.toISOString().slice(0,10); }
  if(typeof v==='number'&&v>20000&&v<80000){ const t=new Date(Math.round((v-25569)*864e5)); return t.toISOString().slice(0,10); }
  const s=String(v).trim(); let m;
  if((m=/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/.exec(s))){ let y=+m[3]; if(y<100) y+=2000; return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`; }
  if((m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s))) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}

/* ============ classificação ============ */
const FORMAS=['Pix','Transferência','Cartão','Dinheiro','Boleto','Depósito','Cheque','Outros'];
const BSB='Baixas sem forma informada';
const OPC={vendas:['Pix','Transferência','Dinheiro','Cartão','Cheque','A prazo','Outros'],entradas:['Pix','Transferência','Boleto','Depósito','Cartão','Cheque','Outros'],receber:['Não informada','Pix','Transferência','Boleto','Dinheiro','Cartão','Cheque','Outros']};
const CAIXA=['Dinheiro','Cartão','Cheque'];
function desligar(id){ D.entradas.forEach(e=>{ if(e.links&&e.links.includes(id)){ e.links=e.links.filter(i=>i!==id); if(!e.links.length){ e.st='ni'; e.manual=false; e.auto=false; e.motivo='Forma alterada: vínculo removido'; } touch('entradas',e); } }); }
function setForma(id,val){
  const x=IDX[id]; if(!x) return; let antes;
  if(x.col==='receber'){ antes=x.formaRec||'Não informada'; x.formaRec=val==='Não informada'?'':val; if(CAIXA.includes(val)) desligar(id); }
  else { antes=x.forma; if(!x.formaOrig) x.formaOrig=x.forma; x.forma=val; if(x.formaOrig===val) delete x.formaOrig;
    if(x.col==='vendas'&&!['Pix','Transferência','Outros'].includes(val)) desligar(id); }
  const orig=(AJ.formas[id]&&AJ.formas[id].o)||(x.col==='receber'?'Não informada':(x.formaOrig||antes));
  gravarAjuste('formas',id,{f:val,o:orig,t:new Date().toISOString()});

  D.entradas.forEach(e=>{ if(AJ.conc[e.id]&&(AJ.conc[e.id].links||[]).includes(id)&&!(e.links||[]).includes(id)) salvarConc(e); });

}

function formaEntrada(t){

  if(/COBRAN|BOLETO|LIQUIDACAO|TITULO/.test(t)) return 'Boleto';
  if(/PIX/.test(t)) return 'Pix';
  if(/DEPOSITO|DEP\.? ?DINH|DEP\b/.test(t)) return 'Depósito';
  if(/TRANSF|TED|\bDOC\b|INTERCREDIS|CREDITO EM CONTA/.test(t)) return 'Transferência';

function formaVenda(t,data,venc){
  const c=norm(t);
  if(/CART|CREDITO|DEBITO|MAQUIN/.test(c)&&!/DIAS|\bDD\b/.test(c)) return 'Cartão';
  if(venc&&data&&venc>data) return 'A prazo';
  if(/PIX/.test(c)) return 'Pix';
  if(/DINHEIRO|ESPECIE/.test(c)) return 'Dinheiro';
  if(/TRANSF|TED|DEPOSITO/.test(c)) return 'Transferência';
  if(/BOLETO|DIAS|\bDD\b|PRAZO|FATURA|\d+\/\d+|CREDIARIO/.test(c)) return 'A prazo';
  if(/CHEQUE/.test(c)) return 'Cheque';

}
function pagadorDe(txt){
  let s=String(txt||'').replace(/\s+/g,' ').trim();
  s=s.replace(/^.*?(Recebimento Pix|REM\.?:|Transfer[êe]ncia Pix|PIX RECEBIDO[^A-Z]*|TED RECEBIDA|DOC RECEBIDO)\s*/i,'');
  s=s.replace(/Transfer[êe]ncia Pix.*$/i,'');
  s=s.replace(/^[\d./-]+\s+/,'');
  const cut=s.search(/(\*{3}|\d{2}\.\d{3}|\d{3}\.\d{3}|\d{8,})/);
  if(cut>2) s=s.slice(0,cut);

const STOP=new Set('LTDA ME EPP EIRELI SA COMERCIO INDUSTRIA SERVICOS SERVICO DOS DAS DE DA DO E EM PIX RECEBIMENTO TRANSFERENCIA REM CLIENTE BALCAO OUTRA IF CRED TRANSF CONTAS RECEBIDA PAGAMENTO LOJA'.split(' '));

function nomeScore(a,b){ const A=toks(a),B=toks(b); if(!A.length||!B.length) return 0; let n=0;

/* ============ armazenamento ============ */
// coleções: entradas, vendas, receber — um documento por data (data do extrato, da venda ou do vencimento)
const COLS=['entradas','vendas','receber'];
const gkey=(col,x)=>col==='receber'?x.venc:x.date;
/* ============ banco de dados: Firebase (Firestore) ============ */
// Coleções: entradas / vendas / receber — um documento por dia ({date, items}).
// Ajustes manuais (trocas de forma e conciliações): documento ajustes/manual, gravado campo a campo.

function lerCfgFB(){ if(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey) return window.FIREBASE_CONFIG; try{ return JSON.parse(localStorage.getItem('conc:fbcfg')||'null'); }catch(e){ return null; } }

const MODO_TESTE=()=>localStorage.getItem('conc:teste')==='1';
const USA_FB=()=>!!db;
const unsubs=[];
const Store={mode:'local', inicial:null,
  async init(){
    if(!db){ this.mode='local'; return; }
    this.mode='firebase';
    const dados={entradas:[],vendas:[],receber:[]};
    const snaps=await Promise.all(COLS.map(c=>db.collection(c).get()));
    snaps.forEach((sn,i)=>sn.forEach(d=>{ const v=d.data(); if(v&&Array.isArray(v.items)) dados[COLS[i]].push(...v.items); }));
    const aj=await db.doc('ajustes/manual').get();
    this.inicial={dados,ajustes:aj.exists?(aj.data()||{}):{}};
  },
  async loadAll(col){
    if(db) return (this.inicial&&this.inicial.dados[col])||[];
    const out=[]; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(`conc:${col}:`)){ const v=JSON.parse(localStorage.getItem(k)); if(v&&v.items) out.push(...v.items);} } }catch(e){}
    return out; },
  async putLote(lote){
    const limpo=x=>{ const o={}; for(const k in x) if(k[0]!=='_') o[k]=x[k]; return JSON.parse(JSON.stringify(o)); };
    const docs=lote.map(({col,key})=>({col,key,items:D[col].filter(x=>gkey(col,x)===key).map(limpo)}));
    if(!db){ try{ docs.forEach(({col,key,items})=>{ if(items.length) localStorage.setItem(`conc:${col}:${key}`,JSON.stringify({date:key,items})); else localStorage.removeItem(`conc:${col}:${key}`); }); return true; }catch(e){ Sync.err='armazenamento cheio'; return false; } }
    try{
      for(let i=0;i<docs.length;i+=400){ const b=db.batch();
        docs.slice(i,i+400).forEach(({col,key,items})=>{ const ref=db.collection(col).doc(key); if(items.length) b.set(ref,{date:key,items,atualizado:firebase.firestore.FieldValue.serverTimestamp(),por:usuario?usuario.email:''}); else b.delete(ref); });
        await b.commit(); }
      return true;
    }catch(e){ Sync.err=traduzErro(e); return false; }
  }
};
function traduzErro(e){ const c=(e&&e.code)||''; if(/permission-denied/.test(c)) return 'sem permissão (confira as regras do Firestore e o e-mail autorizado)'; if(/unavailable/.test(c)) return 'sem conexão'; return (e&&e.message)||String(e); }
const Sync={state:'ok',err:''};
function syncUI(){ const el=document.getElementById('sync'); if(!el) return;
  const off=db&&!navigator.onLine;
  const m={ok:[db?'Salvo no Firebase':'Salvo neste aparelho (teste)','ok'],pend:[off?'Sem internet · será salvo ao reconectar':'Salvando…','pend'],err:['Não salvou · tentar de novo','err']}[Sync.state];
  el.textContent=(Sync.state==='ok'?'✓ ':Sync.state==='err'?'⚠ ':'')+m[0]; el.className='sync '+m[1]; el.title=Sync.err?('Erro: '+Sync.err):''; }
window.addEventListener('online',syncUI); window.addEventListener('offline',syncUI);

/* ============ ajustes manuais (ajustes/manual) ============ */
const AJ={formas:{},conc:{}}; const pendAJ=new Set();
function aplicarAjustes(){
  for(const id in AJ.formas){ const x=IDX[id]; const a=AJ.formas[id]; if(!x||!a) continue;
    if(x.col==='receber') x.formaRec=a.f==='Não informada'?'':a.f;
    else { if(a.o&&a.o!==a.f) x.formaOrig=a.o; else delete x.formaOrig; x.forma=a.f; } }
  for(const id in AJ.conc){ const e=IDX[id]; const a=AJ.conc[id]; if(!e||!a||e.col!=='entradas') continue;
    e.st=a.st; e.links=(a.links||[]).filter(l=>IDX[l]); e.motivo=a.motivo||''; e.manual=true; e.auto=false; if(e.st==='ok'&&!e.links.length) e.st='ni'; }
}
function mesclarAjustes(rem){ let mudou=false;
  for(const c of ['formas','conc']){ const R=(rem&&rem[c])||{}; for(const id in R){ if(pendAJ.has(c+':'+id)) continue; const L=AJ[c][id];
    if(!L||String(R[id].t||'')>String(L.t||'')){ if(JSON.stringify(L)!==JSON.stringify(R[id])){ AJ[c][id]=R[id]; mudou=true; } } } }
  return mudou; }
async function gravarAjuste(campo,id,valor){
  AJ[campo][id]=valor; const pk=campo+':'+id; pendAJ.add(pk); Sync.state='pend'; syncUI();
  let ok=false, erro='';
  if(db){ try{ await db.doc('ajustes/manual').set({[campo]:{[id]:JSON.parse(JSON.stringify(valor))}},{merge:true}); ok=true; }catch(e){ erro=traduzErro(e); } }
  else { try{ localStorage.setItem('conc:ajustes',JSON.stringify(AJ)); ok=true; }catch(e){ erro='armazenamento local indisponível'; } }
  if(ok&&AJ[campo][id]===valor) pendAJ.delete(pk);
  Sync.state=ok?(pendAJ.size||Object.values(dirty).some(x=>x.size)?'pend':'ok'):'err'; Sync.err=ok?'':erro; syncUI();
  if(!ok) toast(`Não foi possível salvar (${erro}). Toque em "tentar de novo" no topo.`,8000);
  return ok;
}
async function enviarAjustes(){ for(const k of [...pendAJ]){ const [c,id]=k.split(':'); await gravarAjuste(c,id,AJ[c][id]); } }
async function carregarAjustes(){
  if(db){ const a=(Store.inicial&&Store.inicial.ajustes)||{}; AJ.formas=a.formas||{}; AJ.conc=a.conc||{}; return; }
  try{ const d=JSON.parse(localStorage.getItem('conc:ajustes')||'null'); if(d){ AJ.formas=d.formas||{}; AJ.conc=d.conc||{}; } }catch(e){}
}
function salvarConc(e){ return gravarAjuste('conc',e.id,{st:e.st,links:e.links||[],motivo:e.motivo||'',t:new Date().toISOString()}); }
const dirty={}; let saveTimer=null, flushing=null, flushAgain=false;
function markDirty(col,key){ (dirty[col]=dirty[col]||new Set()).add(key); Sync.state='pend'; syncUI(); clearTimeout(saveTimer); saveTimer=setTimeout(flush,300); }
async function flush(){
  if(flushing){ flushAgain=true; return flushing; }
  flushing=(async()=>{
    let falhou=false;
    do{ flushAgain=false;
      const jobs=[]; for(const col in dirty){ dirty[col].forEach(k=>jobs.push([col,k])); dirty[col].clear(); }
      if(!jobs.length) break;
      const ok=await Store.putLote(jobs.map(([col,key])=>({col,key})));
      if(!ok){ falhou=true; jobs.forEach(([col,k])=>(dirty[col]=dirty[col]||new Set()).add(k)); }
    } while(flushAgain&&!falhou);
    Sync.state=falhou?'err':(Object.values(dirty).some(x=>x.size)||pendAJ.size?'pend':'ok'); if(!falhou) Sync.err=''; syncUI();
    if(falhou) toast('Não foi possível salvar'+(Sync.err?` (${Sync.err})`:'')+'. Toque em "tentar de novo" no topo.',7000);
  })();
  try{ await flushing; } finally { flushing=null; }
  if(Object.values(dirty).some(x=>x.size)&&Sync.state!=='err') return flush();
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flush(); });
window.addEventListener('pagehide',()=>{ flush(); });
function touch(col,x){ markDirty(col,gkey(col,x)); }
async function recarregarDaPlanilha(silencioso){
  if(!db){ if(!silencioso) toast('Modo de teste: os dados estão neste navegador.'); return; }
  await flush();
  try{ await Store.init(); for(const col of COLS){ D[col]=await Store.loadAll(col); D[col].forEach(x=>x.col=col); } reindex(); await carregarAjustes(); aplicarAjustes();
    Sync.state='ok'; syncUI(); refresh(); if(!silencioso) toast('Dados atualizados.'); }
  catch(e){ toast('Não consegui ler o Firebase: '+traduzErro(e),7000); }
}
// tempo real: o que outro aparelho grava aparece aqui sozinho
let rtTimer=null;
function agendarRefreshRT(){ clearTimeout(rtTimer); rtTimer=setTimeout(()=>{ reindex(); aplicarAjustes(); if(!$('#dlg').open||S.dlgKind==='det') refresh(); },150); }
function ouvirTempoReal(){
  if(!db) return;
  COLS.forEach(col=>{ let primeira=true;
    unsubs.push(db.collection(col).onSnapshot(sn=>{ if(primeira){ primeira=false; return; }
      let mudou=false;
      sn.docChanges().forEach(ch=>{ if(ch.doc.metadata.hasPendingWrites) return; const key=ch.doc.id; if(dirty[col]&&dirty[col].has(key)) return;
        const novos=ch.type==='removed'?[]:((ch.doc.data()||{}).items||[]);
        const atual=D[col].filter(x=>gkey(col,x)===key);
        if(JSON.stringify(atual.map(x=>x.id).sort())===JSON.stringify(novos.map(x=>x.id).sort())&&ch.type==='modified'){
          // mesmos lançamentos: atualiza campos vindos do outro aparelho
          const byId=new Map(novos.map(x=>[x.id,x])); atual.forEach(x=>{ const n=byId.get(x.id); if(n&&JSON.stringify(n)!==JSON.stringify(Object.fromEntries(Object.entries(x).filter(([k])=>k[0]!=='_')))){ Object.assign(x,n,{col}); mudou=true; } });
        } else { D[col]=D[col].filter(x=>gkey(col,x)!==key).concat(novos.map(x=>Object.assign(x,{col}))); mudou=true; } });
      if(mudou) agendarRefreshRT(); },()=>{}));
  });
  unsubs.push(db.doc('ajustes/manual').onSnapshot(sn=>{ if(sn.metadata.hasPendingWrites||!sn.exists) return; if(mesclarAjustes(sn.data())) agendarRefreshRT(); },()=>{}));
}

/* ============ estado ============ */
const D={entradas:[],vendas:[],receber:[]};
const S={tab:'dia',dia:null,de:null,ate:null,quick:'mes',imp:null,filtro:{},selE:null,selItens:new Set(),dq:''};
const HOJE=today();
let IDX={}; // id -> item
function reindex(){ IDX={}; for(const col of COLS) for(const x of D[col]) IDX[x.id]=x; }
// quem está ligado a qual entrada
function linkIndex(){ const m={}; for(const e of D.entradas) (e.links||[]).forEach(id=>{ m[id]={e,st:e.st}; }); return m; }

/* ============ conciliação automática ============ */
// status: ok (conciliado), conf (conferir), ni (não identificado), out (outra entrada: transferência própria, estorno etc.)
function candidatos(e,LI,livres=true){
  const out=[]; const pag=e.pagador||'';
  for(const v of D.vendas){ if(livres&&LI[v.id]&&LI[v.id].e!==e) continue; if(v.forma==='A prazo'||v.forma==='Dinheiro'||v.forma==='Cartão') continue;
    const dd=dayDiff(v.date,e.date); if(dd<-1||dd>5) continue;
    out.push({x:v,tipo:'venda',valorOk:v.valor===e.valor,ns:nomeScore(v.cliente,pag+' '+e.desc),dd}); }
  for(const r of D.receber){ if(livres&&LI[r.id]&&LI[r.id].e!==e) continue; if(r.baixado&&CAIXA.includes(r.formaRec)) continue;
    const dd=r.baixado?dayDiff(r.dataBaixa||r.venc,e.date):dayDiff(r.venc,e.date); if(r.baixado?(dd<-6||dd>3):(dd<-60||dd>180)) continue;
    out.push({x:r,tipo:'receber',valorOk:r.valor===e.valor||(!!r.valorAlt&&r.valorAlt===e.valor),ns:nomeScore(r.cliente,pag+' '+e.desc),dd}); }
  return out;
}
function conciliarAuto(){
  const pend=D.entradas.filter(e=>e.st!=='ok'&&e.st!=='out'&&!e.manual);
  pend.forEach(e=>{ e.st='ni'; e.links=[]; e.motivo=''; });
  let LI=linkIndex(); const usados=new Set(Object.keys(LI));
  const res={ok:0,conf:0,ni:0};
  // 1ª passada: certezas (valor exato + nome confere + candidato único)
  const pares=[];
  for(const e of pend){ if(e.forma==='Cartão') continue;
    const c=candidatos(e,LI).filter(c=>c.valorOk);
    const comNome=c.filter(k=>k.ns>=0.5);
    if(comNome.length===1) pares.push({e,k:comNome[0]});
    else if(comNome.length>1){ comNome.sort((a,b)=>(b.ns-a.ns)||(Math.abs(a.dd)-Math.abs(b.dd))); if(comNome[0].ns>comNome[1].ns) pares.push({e,k:comNome[0]}); }
  }
  pares.sort((a,b)=>(b.k.ns-a.k.ns)||(Math.abs(a.k.dd)-Math.abs(b.k.dd)));
  for(const {e,k} of pares){ if(usados.has(k.x.id)||e.st==='ok') continue;
    e.st='ok'; e.auto=true; e.links=[k.x.id]; e.motivo='Valor, cliente e data conferem'; usados.add(k.x.id); }
  // grupos: vários títulos/vendas do mesmo cliente pagos num único valor
  for(const e of pend){ if(e.st==='ok'||e.forma==='Cartão') continue;
    const c=candidatos(e,{}).filter(k=>!usados.has(k.x.id)&&k.ns>=0.5&&k.x.valor<e.valor);
    const porCli={}; c.forEach(k=>{ (porCli[norm(k.x.cliente)]=porCli[norm(k.x.cliente)]||[]).push(k); });
    for(const cli in porCli){ const g=porCli[cli].slice(0,10); const hit=subsetSum(g,e.valor); if(hit){ e.st='ok'; e.auto=true; e.links=hit.map(k=>k.x.id); e.motivo=`${hit.length} lançamentos do mesmo cliente somam o valor`; hit.forEach(k=>usados.add(k.x.id)); break; } }
  }
  // 2ª passada: possibilidades (precisam de conferência)
  for(const e of pend){ if(e.st==='ok') continue;
    if(e.forma==='Cartão'){ e.st='conf'; e.motivo='Repasse de cartão: conferir com a maquininha'; continue; }
    const c=candidatos(e,{}).filter(k=>!usados.has(k.x.id));
    const exatos=c.filter(k=>k.valorOk).sort((a,b)=>(b.ns-a.ns)||(Math.abs(a.dd)-Math.abs(b.dd)));
    if(exatos.length){ e.st='conf'; e.links=[exatos[0].x.id]; usados.add(exatos[0].x.id);
      e.motivo=exatos.length===1?(exatos[0].ns>=0.5?'Valor e cliente conferem, data distante':'Mesmo valor, cliente não confere'):`${exatos.length} lançamentos com o mesmo valor`; continue; }
    const nome=c.filter(k=>k.ns>=0.5).sort((a,b)=>Math.abs(a.x.valor-e.valor)-Math.abs(b.x.valor-e.valor));
    if(nome.length){ e.st='conf'; e.links=[nome[0].x.id]; usados.add(nome[0].x.id); e.motivo='Cliente confere, valor diferente'; continue; }
    e.st='ni'; e.motivo='Nenhuma venda ou recebimento corresponde';
  }
  D.entradas.forEach(e=>{ res[e.st]=(res[e.st]||0)+1; });
  pend.forEach(e=>touch('entradas',e));
  return res;
}
function subsetSum(items,alvo){
  const n=items.length; if(n<2) return null;
  for(let mask=3; mask<(1<<n); mask++){ if((mask&(mask-1))===0) continue; let s=0,sel=[];
    for(let i=0;i<n;i++) if(mask&(1<<i)){ s+=items[i].x.valor; sel.push(items[i]); if(s>alvo) break; }
    if(s===alvo&&sel.length<=5) return sel; }
  return null;
}

/* ============ números do período ============ */
function inP(d){ return d&&d>=S.de&&d<=S.ate; }
function calc(){
  const LI=linkIndex();
  const vendas=D.vendas.filter(v=>inP(v.date));
  const entradas=D.entradas.filter(e=>inP(e.date));
  const statusAlvo=x=>{ const l=LI[x.id]; return l?(l.st==='ok'?'ok':'conf'):null; };
  // vendas: status
  const dExt=D.entradas.map(e=>e.date).sort(); const cobIni=dExt[0], cobFim=dExt[dExt.length-1];
  const coberto=d=>cobIni&&d>=addDays(cobIni,-1)&&d<=cobFim;
  vendas.forEach(v=>{ const l=LI[v.id]; v._e=l?l.e:null;
    v._st= v.forma==='Dinheiro'?'caixa': v.forma==='Cartão'?'maq': v.forma==='A prazo'?'prazo': l?(l.st==='ok'?'ok':'conf'):coberto(v.date)?'nao':'semext'; });
  // recebido por forma
  const porForma={}; FORMAS_R.forEach(f=>porForma[f]={total:0,itens:[]});
  vendas.filter(v=>v.forma==='Dinheiro'||v.forma==='Cartão').forEach(v=>{ porForma[v.forma].total+=v.valor; porForma[v.forma].itens.push({k:'venda',x:v}); });
  entradas.filter(e=>e.st!=='out').forEach(e=>{ const f=e.forma==='Cartão'?'Cartão':e.forma; porForma[f].total+=e.valor; porForma[f].itens.push({k:'entrada',x:e}); });
  D.receber.filter(r=>r.baixado&&inP(r.dataBaixa)&&!LI[r.id]).forEach(r=>{ const f=r.formaRec&&porForma[r.formaRec]?r.formaRec:BSB; porForma[f].total+=r.valor; porForma[f].itens.push({k:'rec',x:r}); });
  const recebido=FORMAS_R.reduce((a,f)=>a+porForma[f].total,0);
  const receberAll=D.receber;
  const abertos=receberAll.filter(r=>!r.baixado&&(!LI[r.id]||LI[r.id].st!=='ok'));
  const atrasados=abertos.filter(r=>r.venc<HOJE);
  const previstos=abertos.filter(r=>r.venc>=HOJE);
  const recebidosTit=receberAll.filter(r=>(LI[r.id]&&LI[r.id].st==='ok'&&inP(LI[r.id].e.date))||(r.baixado&&inP(r.dataBaixa)));
  const vendasNaoEntrou=vendas.filter(v=>v._st==='nao'&&v.date<HOJE);
  const baixaNaoEntrou=D.receber.filter(r=>r.baixado&&inP(r.dataBaixa)&&!LI[r.id]&&['Pix','Transferência','Boleto'].includes(r.formaRec)&&coberto(r.dataBaixa));
  const byst=st=>entradas.filter(e=>e.st===st);
  return {LI,vendas,entradas,porForma,recebido,abertos,atrasados,previstos,recebidosTit,vendasNaoEntrou,baixaNaoEntrou,
    ok:byst('ok'),conf:byst('conf'),ni:byst('ni'),out:byst('out'),
    tVendas:sum(vendas),tEntradas:sum(entradas.filter(e=>e.st!=='out')),statusAlvo};
}

    cands=all.map(x=>({x,tipo:x.col==='vendas'?'venda':'receber',valorOk:x.valor===e.valor,ns:nomeScore(x.cliente,e.pagador+' '+e.desc),dd:dayDiff(x.col==='vendas'?x.date:(x.dataBaixa||x.venc),e.date)})).map(k=>Object.assign(k,{score:(k.valorOk?10:0)+k.ns*4})); }

/* ============ leitura dos PDFs ============ */
const pnorm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
function pMoney(s){ s=String(s||'').replace(/[^\d,.-]/g,''); if(!s) return 0; const neg=s.startsWith('-'); s=s.replace(/-/g,'').replace(/\./g,'').replace(',','.'); const v=Math.round(parseFloat(s)*100)||0; return neg?-v:v; }
function pDot(s){ return Math.round(parseFloat(String(s).replace(/,/g,''))*100)||0; }
function b2i(d){ const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(d).trim()); return m?`${m[3]}-${m[2]}-${m[1]}`:null; }
async function pdfLines(file){
  if(!window.pdfjsLib) throw new Error('O leitor de PDF não carregou. Verifique a conexão e recarregue a página.');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  H('Diferenças',`Entradas sem dono ${m(sum(C.ni))} · vendas Pix/transferência sem entrada no banco ${m(sum(C.vendasNaoEntrou))} · títulos atrasados ${m(sum(C.atrasados))} (${C.atrasados.length}, listados em Recebimentos em aberto).`);
  if(difs.length) T({head:[['Tipo','Data','Cliente / pagador','Documento','Valor']],body:difs,columnStyles:{0:{cellWidth:44,fontStyle:'bold',textColor:RD},1:{cellWidth:18},3:{cellWidth:34},4:{halign:'right',cellWidth:24}},didParseCell:d=>{ if(d.section==='head'&&d.column.index===4) d.cell.styles.halign='right'; }});
  else { doc.setFontSize(9); doc.setTextColor(...G); doc.text('Nenhuma diferença no período.',M,y); y+=8; }
  // detalhamento dos pagamentos
  H('Detalhamento das entradas no banco','Cada crédito do extrato com o cliente, a venda ou o título correspondente e o status.');
  const es=C.entradas.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.forma.localeCompare(b.forma));
  T({head:[['Data','Forma','Cliente','Venda / documento','Valor','Status']],body:es.map(e=>[brs(e.date),e.forma,clienteDaEntrada(e)+(e.pagador&&clienteDaEntrada(e)!==e.pagador?'\n(pagador: '+e.pagador+')':''),(e.links||[]).map(refDe).join(', ')||'—',m(e.valor),stCol(e.st)]),
    foot:[[{content:`${es.length} entrada(s)`,colSpan:4},m(sum(es)),'']],columnStyles:{0:{cellWidth:12},1:{cellWidth:20},3:{cellWidth:40},4:{halign:'right',cellWidth:22},5:{cellWidth:24}},
    didParseCell:d=>{ if(d.section!=='body'&&d.column.index===4) d.cell.styles.halign='right'; }});
  // vendas dinheiro/cartão
  const vc=C.vendas.filter(v=>v.forma==='Dinheiro'||v.forma==='Cartão');
  if(vc.length){ H('Vendas em dinheiro e cartão','Conferir com o caixa e a maquininha.');
    T({head:[['Data','Forma','Cliente','Venda','Valor']],body:vc.map(v=>[brs(v.date),v.forma,v.cliente,v.doc||'—',m(v.valor)]),foot:[[{content:`${vc.length} venda(s)`,colSpan:4},m(sum(vc))]],columnStyles:{0:{cellWidth:12},4:{halign:'right',cellWidth:24}},didParseCell:d=>{ if(d.section!=='body'&&d.column.index===4) d.cell.styles.halign='right'; }}); }

  H('Recebimentos em aberto',`A vencer ${m(sum(C.previstos))} (${C.previstos.length}) · atrasados ${m(sum(C.atrasados))} (${C.atrasados.length}). Posição em ${br(HOJE)}.`);
  const ab=C.abertos.slice().sort((a,b)=>a.venc.localeCompare(b.venc));
  if(ab.length) T({head:[['Vencimento','Cliente','Documento','Valor','Status']],body:ab.map(r=>[br(r.venc),r.cliente,r.doc||'—',m(r.valor),stCol(r.venc<HOJE?'atraso':'aberto')]),foot:[[{content:`${ab.length} título(s)`,colSpan:3},m(sum(ab)),'']],
    columnStyles:{0:{cellWidth:20},3:{halign:'right',cellWidth:24},4:{cellWidth:20}},didParseCell:d=>{ if(d.section!=='body'&&d.column.index===3) d.cell.styles.halign='right'; }});

async function baixar(nome,data,mime){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime});
  try{ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000); return true; }
  catch(e){ toast('Não consegui baixar o arquivo.'); return false; }
}

/* ============ período ============ */
function setQuick(q){
  S.quick=q;
  if(q==='hoje'){S.de=S.ate=HOJE;} else if(q==='ontem'){S.de=S.ate=addDays(HOJE,-1);} else if(q==='7d'){S.de=addDays(HOJE,-6);S.ate=HOJE;}
  else if(q==='mes'){S.de=HOJE.slice(0,8)+'01';S.ate=HOJE;}
  else { const ds=[...D.entradas.map(e=>e.date),...D.vendas.map(v=>v.date)].filter(Boolean).sort(); S.de=ds[0]||HOJE; S.ate=ds[ds.length-1]||HOJE; }
}

/* ============ eventos ============ */
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-act],[data-tab]'); if(!t) return;
  if(t.dataset.tab&&!t.dataset.act){ S.tab=t.dataset.tab; if($('#dlg').open) $('#dlg').close(); render(); return; }
  const a=t.dataset.act, id=t.dataset.id;
  if(t.tagName==='SELECT'||t.tagName==='INPUT') return;
  switch(a){
    case 'quick': setQuick(t.dataset.q); render(); break;
    case 'sync': { if(Sync.state==='err'){ Sync.state='pend'; syncUI(); await flush(); await enviarAjustes();
        toast(Sync.state==='ok'?'Alterações salvas.':`Ainda não salvou (${Sync.err}).`); } else toast(db?'Tudo salvo no Firebase.':'Modo de teste: dados só neste navegador.'); break; }
    case 'fbsalvarcfg': { try{ const c=lerConfigColada($('#fbcfg').value); localStorage.setItem('conc:fbcfg',JSON.stringify(c)); localStorage.removeItem('conc:teste'); location.reload(); }catch(e){ telaConfig('Configuração inválida: '+e.message); } break; }
    case 'fbteste': localStorage.setItem('conc:teste','1'); location.reload(); break;
    case 'fblogin': loginGoogle(); break;
    case 'fbcfgnovo': localStorage.removeItem('conc:fbcfg'); location.reload(); break;
    case 'fbsair': if(confirm('Sair desta conta neste aparelho?')){ unsubs.forEach(u=>u()); if(window.firebase&&firebase.apps.length) await firebase.auth().signOut(); localStorage.removeItem('conc:teste'); location.reload(); } break;
    case 'dprev': S.dia=addDays(S.dia,-1); S.selE=null; render(); break;
    case 'dnext': S.dia=addDays(S.dia,1); S.selE=null; render(); break;
    case 'dsel': { if(!id||S.selE===id){ S.selE=null; } else { S.selE=id; const e=IDX[id]; S.selItens=new Set(e.links||[]); S.dq=''; } refresh(); break; }
    case 'ditem': { S.selItens.has(id)?S.selItens.delete(id):S.selItens.add(id); refresh(); break; }
    case 'dlink': { const e=IDX[S.selE]; if(!e||!S.selItens.size) break; e.links=[...S.selItens]; e.st='ok'; e.auto=false; e.manual=true; e.motivo='Vinculado no lançamento do dia'; touch('entradas',e); salvarConc(e); S.selE=null; refresh(e.id); agendarConciliacao(); toast(`🟢 ${money(e.valor)} vinculado a ${clienteDaEntrada(e)}.`); break; }
    case 'dout': { const e=IDX[S.selE]; if(!e) break; e.links=[]; e.st='out'; e.manual=true; e.motivo='Não é venda (transferência própria, estorno etc.)'; touch('entradas',e); salvarConc(e); S.selE=null; refresh(e.id); agendarConciliacao(); break; }
    case 'desfaz': { const e=IDX[id]; if(!e) break; e.links=[]; e.st='ni'; e.auto=false; e.manual=true; e.motivo='Vínculo desfeito'; touch('entradas',e); salvarConc(e); refresh(e.id); toast('Vínculo desfeito. A entrada voltou para 🔴 Não identificado.'); break; }
    case 'det': abrirDet(t.dataset.k,t.dataset.f); break;
    case 'detg': S.det.g=t.dataset.v; desenhaDet(); break;
    case 'close': $('#dlg').close(); render(); break;
    case 'filtro': S.filtro[t.dataset.n]=t.dataset.v; render(); break;
    case 'conc': abrirConc(id); break;
    case 'alvo': abrirAlvo(id); break;
    case 'alvopick': { const e=IDX[t.dataset.e]; abrirConc(e.id,[...(e.st==='ok'?e.links:[]),id]); break; }
    case 'ccsel': { const sc=($('#dlg .dlg-b')||{}).scrollTop||0; S.cc.sel.has(id)?S.cc.sel.delete(id):S.cc.sel.add(id); desenhaConc(); const b=$('#dlg .dlg-b'); if(b) b.scrollTop=sc; break; }
    case 'ccok': { const e=IDX[S.cc.id]; e.links=[...S.cc.sel]; e.st='ok'; e.auto=false; e.manual=true; e.motivo='Conferido manualmente'; touch('entradas',e); salvarConc(e); S._noRender=true; $('#dlg').close(); S._noRender=false; refresh(e.id); agendarConciliacao(); toast(`🟢 Conciliado: ${money(e.valor)} de ${clienteDaEntrada(e)}.`); break; }
    case 'ccout': { const e=IDX[S.cc.id]; e.links=[]; e.st='out'; e.manual=true; e.motivo='Marcado como outra entrada (não é venda)'; touch('entradas',e); salvarConc(e); S._noRender=true; $('#dlg').close(); S._noRender=false; refresh(e.id); agendarConciliacao(); break; }
    case 'ccni': { const e=IDX[S.cc.id]; e.links=[]; e.st='ni'; e.manual=true; e.motivo='Marcado manualmente'; touch('entradas',e); salvarConc(e); S._noRender=true; $('#dlg').close(); S._noRender=false; refresh(e.id); break; }
    case 'auto': { D.entradas.forEach(e=>{ if(e.st!=='ok'||e.auto){ if(!e.manual){ e.st='ni'; e.links=[]; } } }); const r=conciliarAuto(); render(); toast(`Conciliação: 🟢 ${r.ok||0} · 🟡 ${r.conf||0} · 🔴 ${r.ni||0}.`); break; }
    case 'pick': $('#fileInput').click(); break;
    case 'addvenda': dlgCadastro('venda'); break;
    case 'addrec': dlgCadastro('receber'); break;
    case 'salvarcad': { const tipo=t.dataset.t; const cli=$('#mCli').value.trim(), pv=parseValor($('#mVal').value), dt=$('#mDt').value;
      if(!cli||!pv||!pv.c||!dt){ toast('Preencha cliente, valor e data.'); break; }
      const x=tipo==='venda'?{col:'vendas',date:dt,valor:Math.abs(pv.c),cliente:cli,doc:$('#mDoc').value.trim(),forma:$('#mForma').value,formaTxt:'Cadastro manual',venc:''}:{col:'receber',venc:dt,valor:Math.abs(pv.c),cliente:cli,doc:$('#mDoc').value.trim(),pedido:'',emissao:HOJE};
      x.id=(tipo==='venda'?'v':'r')+'m'+Math.random().toString(36).slice(2,9); D[x.col].push(x); touch(x.col,x); reindex(); conciliarAuto(); $('#dlg').close(); render(); toast('Salvo.'); break; }
    case 'pdf': { if(!window.jspdf){ toast('O gerador de PDF não carregou. Recarregue a página.'); break; } if(!D.entradas.length&&!D.vendas.length&&!D.receber.length){ toast('Importe os dados antes de gerar o relatório.'); break; }
      try{ const d=gerarPdf(); await baixar(S.de===S.ate?`conciliacao-${S.de}.pdf`:`conciliacao-${S.de}-a-${S.ate}.pdf`,d.output('blob'),'application/pdf'); }catch(e){ console.error(e); toast('Não consegui gerar o PDF.'); } break; }
    case 'zerar': { if(!confirm('Apagar todas as entradas, vendas, recebimentos e conciliações? Não dá para desfazer.')) break;
      for(const col of COLS){ D[col]=[]; } for(const c in dirty) dirty[c].clear(); if(!db){ for(let i=localStorage.length-1;i>=0;i--){ const k=localStorage.key(i); if(k&&k.startsWith('conc:')) localStorage.removeItem(k); } }
      AJ.formas={}; AJ.conc={}; if(db){ try{ for(const col of COLS){ const sn=await db.collection(col).get(); const refs=sn.docs.map(d=>d.ref); for(let i=0;i<refs.length;i+=400){ const b=db.batch(); refs.slice(i,i+400).forEach(r=>b.delete(r)); await b.commit(); } } await db.doc('ajustes/manual').delete(); }catch(e){ toast('Não consegui limpar o Firebase: '+traduzErro(e)); break; } } else { try{ localStorage.removeItem('conc:ajustes'); }catch(e){} } render(); toast('Todos os dados foram apagados.'); break; }
    case 'recarregar': recarregarDaPlanilha(false); break;
    case 'bkexp': { const bk={app:'conciliacao-pagil',versao:1,gerado:new Date().toISOString(),dados:{entradas:D.entradas,vendas:D.vendas,receber:D.receber},ajustes:AJ};
      const limpo=JSON.stringify(bk,(k,v)=>k&&k[0]==='_'?undefined:v); await baixar(`backup-conciliacao-${HOJE}.json`,limpo,'application/json'); break; }
    case 'bkimp': $('#bkInput').click(); break;
  }
});
document.addEventListener('keydown',ev=>{ if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('tr.click,.cand,.drop,.mini')){ ev.preventDefault(); ev.target.click(); } });
document.addEventListener('change',ev=>{ const t=ev.target;
  if(t.dataset&&t.dataset.act==='forma'&&t.dataset.id){ const id=t.dataset.id; setForma(id,t.value); refresh(id); return; }
  if(t.id==='diaInput'){ if(t.value){ S.dia=t.value; S.selE=null; render(); } return; }
  if(t.id==='pDe'||t.id==='pAte'){ const de=$('#pDe').value, ate=$('#pAte').value; if(de&&ate&&de<=ate){ S.de=de; S.ate=ate; S.quick=''; render(); } return; }
});
document.addEventListener('input',ev=>{ const t=ev.target;
  if(t.id==='dq'){ S.dq=t.value; clearTimeout(S._dt); S._dt=setTimeout(()=>{ render(); const b=$('#dq'); if(b){ b.focus(); b.setSelectionRange(b.value.length,b.value.length);} },250); }
  if(t.id==='bq'){ S.filtro.bq=t.value; clearTimeout(S._bt); S._bt=setTimeout(()=>{ render(); const b=$('#bq'); if(b){ b.focus(); b.setSelectionRange(b.value.length,b.value.length);} },250); }
  if(t.id==='ccq'){ S.cc.q=t.value; clearTimeout(S._ct); S._ct=setTimeout(()=>{ S.cc.focus=true; desenhaConc(); },250); }
});
$('#fileInput').addEventListener('change',ev=>{ const f=[...ev.target.files]; ev.target.value=''; if(f.length) importarPdfs(f); });
document.addEventListener('dragover',ev=>{ if(ev.dataTransfer&&[...ev.dataTransfer.types].includes('Files')){ ev.preventDefault(); const z=$('[data-drop]'); if(z) z.classList.add('over'); } });
document.addEventListener('dragleave',ev=>{ const z=ev.target.closest&&ev.target.closest('[data-drop]'); if(z) z.classList.remove('over'); });
document.addEventListener('drop',ev=>{ if(!ev.dataTransfer||!ev.dataTransfer.files.length) return; ev.preventDefault(); const z=$('[data-drop]'); if(z) z.classList.remove('over');
  const f=[...ev.dataTransfer.files].filter(x=>/pdf$/i.test(x.type)||/\.pdf$/i.test(x.name)); if(f.length) importarPdfs(f); else toast('Envie arquivos PDF.'); });
async function importarBackup(txt){
  let bk; try{ bk=JSON.parse(txt); }catch(e){ toast('Arquivo de backup inválido.'); return; }
  if(!bk||!bk.dados){ toast('Arquivo de backup inválido.'); return; }
  const n=COLS.reduce((a,c)=>a+((bk.dados[c]||[]).length),0);
  if(!confirm(`Importar ${n} lançamento(s) do backup? Os dados atuais serão substituídos.`)) return;
  toast('Importando o backup…',20000);
  for(const col of COLS){ D[col]=(bk.dados[col]||[]).map(x=>Object.assign(x,{col})); }
  const aj=bk.ajustes||{}; AJ.formas=aj.formas||{}; AJ.conc=aj.conc||{};
  reindex(); for(const col of COLS){ new Set(D[col].map(x=>gkey(col,x))).forEach(k=>markDirty(col,k)); }
  for(const c of ['formas','conc']) for(const id in AJ[c]) pendAJ.add(c+':'+id);
  await flush(); await enviarAjustes(); aplicarAjustes(); render();
  if(Sync.state==='err'){ toast('O backup não foi gravado por completo. Toque em "tentar de novo" no topo.',8000); return; }
  toast(`Backup importado: ${n} lançamento(s).`);
}
$('#bkInput').addEventListener('change',async ev=>{ const f=ev.target.files[0]; ev.target.value=''; if(f) importarBackup(await f.text()); });
$('#dlg').addEventListener('close',()=>{ if(S._noRender) return; if(S.tab!=='importar'){ const k=guardarScroll(); render(); restaurarScroll(k); } });

/* ============ início ============ */
(async()=>{
  S.dia=HOJE; setQuick('mes'); render();
  let est; try{ est=await iniciarFirebase(); }catch(e){ telaConfig(e.message); return; }
  if(est==='config'){ telaConfig(); return; } if(est==='login'){ telaLogin(); return; }
  try{ await Store.init(); }catch(e){ telaLogin('Não consegui ler os dados: '+traduzErro(e)); return; }
  for(const col of COLS){ D[col]=await Store.loadAll(col); D[col].forEach(x=>x.col=col); }
  reindex(); await carregarAjustes(); aplicarAjustes(); syncUI();
  if(D.entradas.length||D.vendas.length){ const ds=[...D.entradas.map(e=>e.date),...D.vendas.map(v=>v.date)].filter(d=>d<=HOJE).sort(); if(ds.length&&!ds.includes(HOJE)) S.dia=ds[ds.length-1]; setQuick('mes'); if(!ds.some(d=>d>=S.de)) { setQuick('tudo'); } }
  render(); ouvirTempoReal();
})();
